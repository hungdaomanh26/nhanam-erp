function ch(id,rows,k,col){const c=$(id);if(!c)return;const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);g.font='11px JetBrains Mono,monospace';
 if(rows.length<2){g.fillStyle='#8b97a5';g.fillText('Chưa đủ dữ liệu lịch sử (backend ghi 1 điểm mỗi 30 giây)',14,28);return}
 const L=40,R=12,T=10,B=22,pw=w-L-R,ph=h-T-B,t0=rows[0].ts,t1=rows[rows.length-1].ts;let a=Math.min(...rows.map(r=>r[k])),b=Math.max(...rows.map(r=>r[k]));if(b-a<4){a-=2;b+=2}a=Math.floor(a);b=Math.ceil(b);
 for(let i=0;i<=4;i++){const y=T+ph*i/4;g.strokeStyle='#ffffff12';g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillStyle=col;g.textAlign='right';g.fillText((b-(b-a)*i/4).toFixed(0),L-6,y+4)}
 g.fillStyle='#8b97a5';g.textAlign='center';for(let i=0;i<=5;i++)g.fillText(new Date((t0+(t1-t0)*i/5)*1000).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}),L+pw*i/5,h-6);
 const X=r=>L+pw*(r.ts-t0)/(t1-t0||1),Y=r=>T+ph*(1-(r[k]-a)/(b-a)),gr=g.createLinearGradient(0,T,0,T+ph);gr.addColorStop(0,col+'44');gr.addColorStop(1,col+'00');
 g.beginPath();rows.forEach((r,i)=>i?g.lineTo(X(r),Y(r)):g.moveTo(X(r),Y(r)));g.strokeStyle=col;g.lineWidth=2.2;g.lineJoin='round';g.stroke();g.lineTo(X(rows[rows.length-1]),T+ph);g.lineTo(X(rows[0]),T+ph);g.fillStyle=gr;g.fill()}
async function hist(h){if(!FDB){HI=[];return HI}try{const since=Date.now()/1000-h*3600;const s=await FDB.ref('greenhouse_readings').orderByChild('ts').startAt(since).limitToLast(2000).once('value');HI=Object.values(s.val()||{}).sort((a,b)=>a.ts-b.ts)}catch(e){HI=[]}return HI}

  const L=[card('🌡️','SHT20 Sensor','Slave ID 01 · FC 0x04',[['Nhiệt độ',f1(s.temperature)+' °C'],['Độ ẩm',f1(s.humidity)+' %'],['Register','0x0001 - 0x0002'],['Baudrate','9600 8N1']]),

report:{t:'Báo cáo',s:'Thống kê vận hành và xuất dữ liệu telemetry / cảnh báo.',
 b:()=>`<div class="g4" id="rs"></div><div class="card" style="margin-top:18px"><h3 style="margin-bottom:14px">Xuất dữ liệu</h3><div class="row"><button class="bt pr" onclick="csv()">📥 CSV · Lịch sử telemetry</button><button class="bt" id="xa">📥 CSV · Cảnh báo</button><button class="bt" id="xj">📥 JSON · Toàn bộ</button></div></div>`,
 i(){hist(24).then(()=>this.u(ST));$('#xa').onclick=()=>dl('canh_bao.csv','text/csv','time,type,level,message\n'+EV.map(e=>`${tm(e.ts)},${cls(e)[0]},${cls(e)[1]},"${e.msg.replace(/"/g,"'")}"`).join('\n'));$('#xj').onclick=()=>dl('nha_nam.json','application/json',JSON.stringify({status:ST,history:HI,events:EV},null,1))},
 u(s){if(!$('#rs')||!s)return;const T=HI.map(r=>r.temp),mx=T.length?Math.max(...T):null,mn=T.length?Math.min(...T):null,H=HI.map(r=>r.hum);
  $('#rs').innerHTML=[['NHIỆT ĐỘ TRUNG BÌNH',f1(avg('temp'))+' °C',mn==null?'':f1(mn)+' → '+f1(mx)+' °C',''],['ĐỘ ẨM TRUNG BÌNH',f1(avg('hum'))+' %',H.length?f1(Math.min(...H))+' → '+f1(Math.max(...H))+' %':'',''],['THỜI GIAN HOẠT ĐỘNG',Math.floor(s.uptime_s/3600)+'h '+Math.floor(s.uptime_s%3600/60)+'m','Phiên backend hiện tại',''],['ĐIỂM DỮ LIỆU',HI.length,'Trong 24 giờ qua',''],['QUẠT CHẠY',pct('fan')+'%','Tỉ lệ thời gian ON','#818cf8'],['PHUN SƯƠNG CHẠY',pct('mist')+'%','Tỉ lệ thời gian ON','#22d3ee'],['NHIỆT ĐỘ CAO NHẤT',f1(mx)+' °C','Trong 24 giờ','#f59e0b'],['NHIỆT ĐỘ THẤP NHẤT',f1(mn)+' °C','Trong 24 giờ','#34d399']].map(([a,b,d,c])=>`<div class="card"><div class="lbl">${a}</div><div class="st" style="font-size:28px;color:${c}">${b}</div><small style="color:var(--mut)">${d}</small></div>`).join('')}},
settings:{t:'Cài đặt',s:'Cấu hình ngưỡng điều khiển, khóa API và cảnh báo âm thanh.',
 b:()=>`<div class="g2"><div class="card"><h3 style="margin-bottom:12px">Kết nối</h3>${kv('Dữ liệu','Realtime DB · '+FBCFG.projectId)}${kv('Kênh','status · readings · events · commands')}${kv('Đồng bộ HMI','Realtime · qua Firebase')}<div id="cs"></div>${kv('Tài khoản',ME.user)}${kv('Vai trò',ME.role)}${kv('Truy cập','☁️ Firebase (rules mở)')}</div>
 <div class="card"><h3 style="margin-bottom:12px">Ngưỡng điều khiển (AUTO)</h3><form id="fm"></form><h4>Cảnh báo âm thanh</h4><div class="row"><button class="bt pr" id="s1">🔊 Bật</button><button class="bt" id="s2">▶ Test</button></div></div></div>`,
 i(){const F=[['temp_min','Sưởi BẬT khi T dưới','°C'],['temp_max','Quạt + phun BẬT khi T trên','°C'],['temp_alarm','Cảnh báo quá nhiệt','°C'],['temp_hyst','Vùng trễ nhiệt độ','°C'],['hum_min','Phun sương BẬT khi H dưới','%'],['hum_max','Quạt hút BẬT khi H trên','%'],['hum_hyst','Vùng trễ độ ẩm','%'],['mist_pulse_on_s','Phun: thời gian bật','s'],['mist_pulse_off_s','Phun: thời gian nghỉ','s'],['failsafe_timeout_s','Failsafe (mất cảm biến)','s']];
  $('#fm').innerHTML=F.map(([k,l,u])=>`<div class="fr"><span>${l} (${u})</span><input type="number" step="0.5" name="${k}" value="${ST?ST.settings[k]:''}"></div>`).join('')+'<button class="bt pr" style="width:100%">💾 Lưu &amp; đồng bộ sang HMI</button>';
  $('#fm').onsubmit=async e=>{e.preventDefault();const b={};new FormData(e.target).forEach((v,k)=>b[k]=parseFloat(v));try{await fbCmd({type:'settings',values:b});toast('Đã gửi ngưỡng qua Firebase — HMI sẽ áp dụng')}catch(x){toast('Lỗi: '+x.message)}};
  $('#lo')&&($('#lo').onclick=logout);if(!can('admin'))$$('#fm input,#fm button').forEach(x=>x.disabled=true);$('#s1').onclick=()=>{SND=!SND;snd();beep()};$('#s2').onclick=()=>{SND=true;beep();snd()};snd()},
 u(s){$('#cs')&&($('#cs').innerHTML=kv('Trạng thái',s.hmi_online?'<span style="color:#34d399">HMI online ✓</span>':'<span style="color:#f87171">HMI offline</span>')+kv('Cảm biến',s.sensor_ok?'Ổn định':'Mất kết nối')+kv('Chế độ',s.simulate?'Mô phỏng':'Phần cứng thật'))}}};
function dl(n,t,c){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
const RK={viewer:1,operator:2,admin:3},can=r=>RK[ME.role]>=RK[r],csv=async()=>{if(HI.length<2)await hist(24);dl('greenhouse_history.csv','text/csv','time,temp_C,humidity_%,fan,mist,heater,alarm\n'+HI.map(r=>[tm(r.ts),r.temp,r.hum,r.fan,r.mist,r.heater,r.alarm].join(',')).join('\n'))};
function showLogin(){$('#lg').hidden=false}function logout(){TOK='';localStorage.removeItem('gh_tok');location.reload()}
$('#lf').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});TOK=r.token;localStorage.setItem('gh_tok',TOK);$('#lg').hidden=true;$('#le').textContent='';init()}catch(x){$('#le').textContent=x.message}};
async function init(){ME={user:'firebase',role:'admin',local:false};$('#lg').hidden=true;$('#un').textContent='';$('#ac').textContent='☁️ Firebase';$('#out').hidden=true;
  if(!FDB){toast('Không nạp được Firebase SDK — cần Internet');setOn(false,'⚠ Không nạp được Firebase SDK (cần Internet)');return}
  go();refresh();evs()}
// ---- âm thanh ----
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(e){}}
function snd(){const b=$('#snd');b.querySelector('b').textContent=SND?'Âm thanh: BẬT':'Bật âm thanh';const s=$('#s1');s&&(s.textContent=SND?'🔊 Đang bật':'🔊 Bật')}
$('#snd').onclick=()=>{SND=!SND;snd();if(SND)beep()};
// ---- giám sát đường truyền ----
let BID=0,BIN=false,PAUSE=false;const bn=h=>h.split(' ').map(x=>isNaN(parseInt(x,16))?x:parseInt(x,16).toString(2).padStart(8,'0')).join(' ');
function bline(f,bd){const t=new Date(f.ts*1000),ts=t.toLocaleTimeString('vi-VN',{hour12:false})+'.'+String(t.getMilliseconds()).padStart(3,'0');if(f.dir=='ERR')return`<div class="bl ERR"><i>[${ts}]</i> ✖ ${f.text}</div>`;
 return`<div class="bl ${f.dir}"><i>[${ts}]</i> ${f.dir=='TX'?'TX ▶':'RX ◀'} ${f.fields.map((x,i)=>`<b class="${i==0?'a':i==1?'f':x[0]=='CRC'?'c':'d'}" title="${x[0]}">${BIN?bn(x[1]):x[1]}</b>`).join(' ')}<em>${f.text}${f.rtt!=null?' · RTT '+f.rtt+' ms':''} · ${f.bits} bit · ${f.ms} ms @ ${bd} baud</em></div>`}
async function busPoll(){const st=ST&&ST.bus;if(cur!==P.dashboard||PAUSE||!$('#con')||!st)return;BUSST=st;
 $('#b-p').textContent=st.polls??'–';$('#b-r').textContent=st.rtt_avg==null?'–':Math.round(st.rtt_avg)+' ms';$('#b-o').textContent=st.rate==null?'–':st.rate+'%';
 $('#b-i').textContent=`${st.port||'mô phỏng'} · ${st.baud||9600} 8N1 · TX ${st.tx_bytes||0} B · RX ${st.rx_bytes||0} B`;
 if(!$('#con').children.length)$('#con').innerHTML='<div class="bl"><i>'+new Date().toLocaleTimeString('vi-VN')+'</i> Khung TX/RX chi tiết hiển thị tại HMI (máy chủ). Thống kê cập nhật qua Firebase.</div>'}
// ---- định tuyến và vòng cập nhật ----
function go(){if(TH){TH.dead=true;TH.rd.dispose();TH=null}const h=(location.hash||'#dashboard').slice(1);cur=P[h]||P.dashboard;$$('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+(P[h]?h:'dashboard')));
 $('#view').innerHTML=`<div class="hr"><div><h1>${cur.t}</h1><p class="sub">${cur.s}</p></div></div>`+cur.b();cur.i&&cur.i();ST&&cur.u(ST)}
function setOn(on,msg){const hw=on&&ST&&ST.sensor_ok;$('#pl').className='pill '+(hw?'ok':on?'':'bad');$('#pt').textContent=!on?'Mất kết nối':hw?'Online':'Mất cảm biến';$('#bell').classList.toggle('on',!on||!hw||(ST&&ST.alarm));const e=$('#err');e.textContent=msg||'';e.classList.toggle('show',!!msg)}
async function refresh(){if(!FDB){setOn(false,'⚠ Không nạp được Firebase SDK — kiểm tra Internet');return}
 try{const snap=await FDB.ref('greenhouse/status').once('value');
  if(!snap.exists()){setOn(false,'⚠ Chưa có dữ liệu trên Firebase — mở HMI tại nhà kính để đẩy dữ liệu');return}
  const s=snap.val(),age=fbAge(s),live=age!=null&&age<15;s.sensor_ok=!!s.sensor_ok&&live;s.hmi_online=live;ST=s;BUSST=s.bus||null;
  setOn(live,live?(s.sensor_ok?'':'⚠ Mất kết nối phần cứng — kiểm tra cáp RS-485 / cảm biến SHT20'):'⚠ HMI không đẩy dữ liệu lên Firebase ('+Math.round(age)+'s)');
  cur&&cur.u(s);
  if(SND&&(s.alarm||!s.sensor_ok)&&Date.now()-lastBeep>5000){lastBeep=Date.now();beep()}}catch(e){setOn(false,'⚠ Lỗi đọc Firebase: '+(e.message||e))}}
async function evs(){if(!FDB)return;try{const snap=await FDB.ref('greenhouse_events').orderByChild('ts').limitToLast(200).once('value');EV=Object.values(snap.val()||{}).sort((a,b)=>b.ts-a.ts);cur&&(cur===P.alerts||cur===P.dashboard)&&ST&&cur.u(ST)}catch(e){}}
$('#q').oninput=e=>{Q=e.target.value;if(location.hash!='#alerts'&&location.hash!='#devices'){location.hash='#alerts'}else cur.u(ST)};
addEventListener('hashchange',go);addEventListener('resize',()=>cur===P.monitor&&cur.i());
init();setInterval(refresh,2000);setInterval(evs,10000);setInterval(busPoll,1000);
</script></body></html>
